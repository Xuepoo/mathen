name: Build Python package

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv build
      - name: PyPI publishing disabled
        run: >-
          echo "PyPI publishing is intentionally disabled until the package
          passes release validation."
