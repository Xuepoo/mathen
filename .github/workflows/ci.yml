name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --locked
      - run: uv run mathen validate
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  web-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:api
      - run: bun run build
      - run: bun run db:migrate:local
      - run: bun run db:seed:local
