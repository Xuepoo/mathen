name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build web assets
        run: bun run build
      - name: Apply D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: bun run db:migrate:remote
      - name: Deploy Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_HOSTNAME: ${{ vars.TURNSTILE_HOSTNAME }}
          TURNSTILE_SESSION_TTL_SECONDS: ${{ vars.TURNSTILE_SESSION_TTL_SECONDS }}
        run: |
          args=()
          for name in TURNSTILE_SITE_KEY TURNSTILE_HOSTNAME TURNSTILE_SESSION_TTL_SECONDS; do
            if [ -n "${!name:-}" ]; then
              args+=(--var "${name}:${!name}")
            fi
          done
          bun run wrangler deploy "${args[@]}"

      - name: Configure Worker secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
        run: |
          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
            printf '%s' "$TURNSTILE_SECRET_KEY" | bun run wrangler secret put TURNSTILE_SECRET_KEY
          fi
          if [ -n "${API_ACCESS_TOKEN:-}" ]; then
            printf '%s' "$API_ACCESS_TOKEN" | bun run wrangler secret put API_ACCESS_TOKEN
          fi
