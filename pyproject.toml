[project]
name = "mathen"
version = "0.0.1"
description = "Evidence-backed architecture knowledge base and CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mathen = "mathen.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
