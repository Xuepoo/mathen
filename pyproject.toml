[project]
name = "mathen"
version = "0.1.0"
description = "A structured knowledge base for software architecture models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mathen = "mathen.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
